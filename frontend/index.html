<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0C0C0C" />

    <!-- Primary Meta Tags -->
    <title>Athul Krishna — Full-Stack Engineer &amp; Co-Founder</title>
    <meta name="title" content="Athul Krishna — Full-Stack Engineer & Co-Founder" />
    <meta
      name="description"
      content="Portfolio of Athul Krishna, Full-Stack Developer and Co-Founder at Trawbit Technologies. Digital products engineered with precision, scalability, and editorial clarity."
    />
    <meta
      name="keywords"
      content="Athul Krishna, Full Stack Developer, Software Engineer, Laravel, PHP, React, Vue, Next.js, Flutter, SQL, Trawbit Technologies, Product Builder"
    />
    <meta name="author" content="Athul Krishna K" />
    <meta name="robots" content="index, follow" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Preconnect & DNS-Prefetch for fast font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />

    <!-- Editorial Creative Font System: Bricolage Grotesque (Display), Instrument Serif (Editorial Italic), Plus Jakarta Sans (Body), IBM Plex Mono (Technical) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&amp;family=Inter:wght@400;500;600&amp;family=Instrument+Serif:ital@0;1&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap"
      rel="stylesheet"
    />

    <!-- Pre-hydration Theme Setup (Zero Flash) -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('worth_theme');
          var prefersDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme =
            saved === 'dark' || saved === 'light'
              ? saved
              : prefersDark
                ? 'dark'
                : 'dark';
          var root = document.documentElement;
          var metaTheme = document.querySelector('meta[name="theme-color"]');
          if (theme === 'dark') {
            root.classList.add('dark');
            root.classList.remove('light');
            root.setAttribute('data-theme', 'dark');
            root.style.colorScheme = 'dark';
            if (metaTheme) metaTheme.setAttribute('content', '#0C0C0C');
          } else {
            root.classList.add('light');
            root.classList.remove('dark');
            root.setAttribute('data-theme', 'light');
            root.style.colorScheme = 'light';
            if (metaTheme) metaTheme.setAttribute('content', '#F2F1EC');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[var(--bg-primary)] text-[var(--text-primary)] antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
