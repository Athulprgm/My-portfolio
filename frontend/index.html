<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030712" />
    
    <!-- Primary Meta Tags -->
    <title>Athul Krishna | Full-Stack Developer & Co-Founder</title>
    <meta name="title" content="Athul Krishna | Full-Stack Developer & Co-Founder" />
    <meta name="description" content="Portfolio of Athul Krishna, Full-Stack Developer and Co-Founder at Trawbit Technologies. Digital products engineered with precision, scalability, and editorial clarity." />
    <meta name="keywords" content="Athul Krishna, Full Stack Developer, Software Engineer, Laravel, PHP, React, Vue, Next.js, Flutter, SQL, Trawbit Technologies, Product Builder" />
    <meta name="author" content="Athul Krishna K" />
    <meta name="robots" content="index, follow" />

    <!-- Preconnect & DNS-Prefetch for ultra-fast resource loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />

    <!-- Google Fonts: Instrument Sans (Worth Agency aesthetic), Newsreader (editorial italics), Space Mono -->
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500;1,6..72,600&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Pre-hydration Theme Setup -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('worth_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = (saved === 'dark' || saved === 'light') ? saved : (prefersDark ? 'dark' : 'light');
          var root = document.documentElement;
          if (theme === 'dark') {
            root.classList.add('dark');
            root.classList.remove('light');
            root.setAttribute('data-theme', 'dark');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.add('light');
            root.classList.remove('dark');
            root.setAttribute('data-theme', 'light');
            root.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[var(--bg-primary)] text-[var(--text-primary)] antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
